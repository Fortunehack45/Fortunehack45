<svg width="495" height="220" viewBox="0 0 495 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .header {
      font: 700 18px 'Segoe UI', Ubuntu, -apple-system, sans-serif;
      fill: #D9A441;
    }
    .stat {
      font: 700 14px 'Segoe UI', Ubuntu, -apple-system, sans-serif;
      fill: #c9d1d9;
    }
    .stat-val {
      font: 600 14px 'Segoe UI', Ubuntu, -apple-system, sans-serif;
      fill: #f0f6fc;
    }
    .stat-highlight {
      font: 700 14px 'Segoe UI', Ubuntu, -apple-system, sans-serif;
      fill: #D9A441;
    }
    .bold { font-weight: 700 }
    .icon {
      fill: #D9A441;
      display: inline-block;
    }
    .rank-circle-rim {
      stroke: #D9A441;
      fill: none;
      stroke-width: 6;
      opacity: 0.2;
    }
    .rank-circle {
      stroke: #D9A441;
      stroke-dasharray: 250;
      stroke-dashoffset: 25;
      fill: none;
      stroke-width: 6;
      stroke-linecap: round;
      opacity: 0.9;
    }
    .rank-text {
      font: 800 24px 'Segoe UI', Ubuntu, -apple-system, sans-serif;
      fill: #D9A441;
    }
  </style>

  <rect
    x="0.5"
    y="0.5"
    rx="6"
    width="494"
    height="219"
    fill="#0d1117"
    stroke="#30363d"
    stroke-width="1"
  />

  <!-- Title Header -->
  <text x="25" y="32" class="header">My GitHub Statistics</text>

  <!-- Circular Rank Badge A++ -->
  <g transform="translate(400, 110)">
    <circle class="rank-circle-rim" cx="0" cy="0" r="38" />
    <circle class="rank-circle" cx="0" cy="0" r="38" transform="rotate(-90)" />
    <text x="0" y="8" class="rank-text" text-anchor="middle">A++</text>
  </g>

  <!-- Statistics Rows -->
  <g transform="translate(0, 42)">
    <!-- 1. Total Stars -->
    <g transform="translate(25, 14)">
      <svg class="icon" viewBox="0 0 16 16" width="16" height="16">
        <path fill-rule="evenodd" d="M8 .25a.75.75 0 01.673.418l1.882 3.815 4.21.612a.75.75 0 01.416 1.279l-3.046 2.97.719 4.192a.75.75 0 01-1.088.791L8 12.347l-3.766 1.98a.75.75 0 01-1.088-.79l.72-4.194L.818 6.374a.75.75 0 01.416-1.28l4.21-.611L7.327.668A.75.75 0 018 .25zm0 2.445L6.615 5.5a.75.75 0 01-.564.41l-3.097.45 2.24 2.184a.75.75 0 01.216.664l-.528 3.084 2.769-1.456a.75.75 0 01.698 0l2.77 1.456-.53-3.084a.75.75 0 01.216-.664l2.24-2.183-3.096-.45a.75.75 0 01-.564-.41L8 2.694v.001z"/>
      </svg>